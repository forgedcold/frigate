      threshold: 18
      contour_area: 8
      improve_contrast: true
    notifications:
      enabled: true
    review:
      alerts:
        labels:
          - person
          - car
          - dog
          - cat
        required_zones:
          - driveway_entrance
          - front_curb
          - neighbor_driveway
          - yard_security_left
          - yard_security_path
          - yard_security_right
      detections:
        required_zones:
          - driveway_entrance
          - front_curb
          - neighbor_driveway
          - yard_security_left
          - yard_security_path
          - yard_security_right
      genai:
        enabled: true
        alerts: true
        detections: false
        image_source: preview
        additional_concerns:
          - person repeatedly returns to the same private area overnight
          - person lingers near vehicles, doors, gates, windows, or porch
          - person carries away an object or handles a package
        activity_context_prompt: "### Normal Activity Indicators (Level 0)\n- Known
          or verified people at any time.\n- Brief routine residential movement with
          a clear normal purpose.\n- Deliveries, package drop-offs, guests, pets,
          or service work during normal hours.\n- People, vehicles, or animals passing
          through public areas without entering private zones.\n- Repeated detections
          caused by the same routine movement, shadows, headlights, or camera artifacts.\n\
          \n### Needs Review Indicators (Level 1)\n- Unidentified person in private
          areas between 11 PM and 6 AM.\n- Person lingering near vehicles, doors,
          gates, windows, or the porch without a clear normal purpose.\n- Repeated
          returns to the same private area during the overnight period.\n- Person
          carrying away an object, handling packages, checking access points, or looking
          into vehicles/windows.\n- Activity that is unclear but occurs in a private
          zone overnight.\n\n### Critical Threat Indicators (Level 2)\n- Forced entry,
          active theft, property damage, visible weapons, aggression, or break-in
          tools.\n\n### Reporting Preference\n- Be concise and factual.\n- Group repeated
          activity when possible.\n- Do not describe static background details.\n\
          - Do not describe appearance unless it is directly relevant to a security
          concern.\n- Do not speculate about identity or intent."
