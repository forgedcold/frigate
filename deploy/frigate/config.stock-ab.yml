          - person lingers near vehicles, doors, gates, windows, or porch
          - person carries away an object or handles a package
        activity_context_prompt: "### Normal Activity Indicators (Level 0)\n- Known
          or verified people at any time.\n- Brief routine residential movement with
          a clear normal purpose.\n- Deliveries, package drop-offs, guests, pets,
          or service work during normal hours.\n- People, vehicles, or animals passing
