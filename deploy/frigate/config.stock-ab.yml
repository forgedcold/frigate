storage:
  tiers:
    - path: /mnt/local/recordings
      max_age_hours: 18
    - path: /media/frigate/recordings
      max_age_hours:
  migration_interval: 300
  migration_timeout: 120

logger:
  default: info

mqtt:
  enabled: true
  host: 192.168.1.44
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'
  port: 1883
  client_id: frigate
  topic_prefix: frigate

genai:
  provider: gemini
  model: gemini-2.5-flash-lite
  api_key: '{FRIGATE_GEMINI_API_KEY}'

detectors:
  ov:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

ffmpeg:
  global_args: -hide_banner -loglevel warning
  hwaccel_args: preset-vaapi
  output_args:
    record: preset-record-generic-audio-aac
    detect: -f rawvideo -pix_fmt yuv420p

go2rtc:
  streams:
    duo3_front_main:
      - rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASS}@10.2.2.10:554/h265Preview_01_main#rtsp_transport=tcp
    duo3_front:
      - ffmpeg:duo3_front_main#video=h264#width=1920#height=540#hardware#audio=aac
    duo3_front_sub:
      - rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASS}@10.2.2.10:554/h264Preview_01_sub#rtsp_transport=tcp
    doorbell_main:
      - rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASS}@10.2.2.11:554/h264Preview_01_main#rtsp_transport=tcp
    doorbell_sub:
      - rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASS}@10.2.2.11:554/h264Preview_01_sub#rtsp_transport=tcp
    trackmix_main:
      - rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASS}@192.168.1.243:554/h264Preview_01_main#rtsp_transport=tcp
    trackmix_sub:
      - rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASS}@192.168.1.243:554/h264Preview_01_sub#rtsp_transport=tcp
    tapo_hallway_main:
      - rtsp://rogitor:{FRIGATE_REOLINK_PASS}@192.168.1.241:554/stream1#rtsp_transport=tcp#recv_buffer_size=1048576#send_buffer_size=1048576

detect:
  enabled: true
  max_disappeared: 15
  stationary:
    interval: 50
    threshold: 50
    max_frames:
      default: 36000

snapshots:
  enabled: true
  timestamp: true
  bounding_box: true
  crop: true

motion:
  threshold: 10
  contour_area: 5
  delta_alpha: 0.3
  improve_contrast: true

record:
  enabled: true
  continuous:
    days: 14
  alerts:
    pre_capture: 10
    post_capture: 15
    retain:
      days: 14
      mode: all
  detections:
    retain:
      days: 14
      mode: all

review:
  alerts:
    labels:
      - person
      - car
      - dog

cameras:
  duo3_front:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/duo3_front_main
          input_args: preset-rtsp-restream
          roles: [detect, record]
        - path: rtsp://127.0.0.1:8554/duo3_front_sub
          input_args: preset-rtsp-restream
          roles: [playback]
    live:
      streams:
        Panoramic (H264): duo3_front
        Fluent (H264): duo3_front_sub
        High Res (H265): duo3_front_main
    detect:
      enabled: true
      width: 4096
      height: 1152
      fps: 6
      max_disappeared: 120
      stationary:
        threshold: 120
    objects:
      genai:
        enabled: true
        prompt: |-
          Describe only this {label} action for a security notification.

          Rules:
          - Identify if the person is performing yard work (mowing, gardening, sprinklers). If they are, state 'Routine Activity: Yard Work'.

          - One sentence only.

          - Maximum 12 words.

          - Identify if the person is arriving (moving toward the house) or leaving
          (moving toward the street).

          - Do not describe background, lighting, weather, camera angle, or image
          quality.

          - Do not describe appearance, age, gender, clothing, or body type.

          - Do not speculate about identity or intent.

          - Use Routine motion for unimportant passing movement.

          - Use Unclear activity if the action is not clear.
        objects:
          - person
      track: [person, dog, car, cat]
      filters:
        person:
          threshold: 0.6
          min_area: 12000
          max_area: 220000
          mask: 
            0.252,0.441,0.196,0.461,0.17,0.562,0.188,0.641,0.248,0.646,0.294,0.484
        dog:
          threshold: 0.22
          min_area: 300
          max_area: 80000
        car:
          threshold: 0.55
          min_area: 30000
          max_area: 1000000
    zones:
